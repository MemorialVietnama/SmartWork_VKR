services:
  db:
    image: postgres:16-alpine
    container_name: smartwork-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-smartwork}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smartwork_secret}
      POSTGRES_DB: ${POSTGRES_DB:-smartwork}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smartwork} -d ${POSTGRES_DB:-smartwork}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: smartwork-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  mail:
    build:
      context: ./mail
      dockerfile: Dockerfile
    container_name: smartwork-mail
    ports:
      - "${MAILHOG_WEB_PORT:-8025}:8025"
      - "${MAILHOG_SMTP_PORT:-1025}:1025"
    environment:
      MH_SMTP_BIND_ADDR: 0.0.0.0:1025

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smartwork-api
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://smartwork:smartwork_secret@db:5432/smartwork}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-to-a-long-random-string}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:4200,http://127.0.0.1:4200,http://localhost,http://127.0.0.1}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mail:
        condition: service_started
    ports:
      - "${API_PORT:-8000}:8000"

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        API_URL: ${API_PUBLIC_URL:-http://localhost:8000}
    container_name: smartwork-web
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-80}:80"

volumes:
  postgres_data:
  redis_data:
