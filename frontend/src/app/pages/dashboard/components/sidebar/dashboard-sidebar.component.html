<aside class="sidebar">
  <a routerLink="/dashboard" class="sidebar-brand" aria-label="SmartWork dashboard">
    <img src="/full_logo.png" alt="SmartWork" class="sidebar-brand__full" />
  </a>
  <div class="sidebar-head">
    <div class="sidebar-head-top">
      <p-tag [severity]="'info'" [value]="isOwner() ? 'owner' : 'staff'" />
      <button type="button" class="notify-btn" (click)="openNotifications()" aria-label="Открыть уведомления">
        <i class="pi pi-bell"></i>
        @if (unreadNotifications() > 0) {
          <small class="notify-badge">{{ unreadNotifications() }}</small>
        }
      </button>
    </div>
    <h3>{{ user()?.last_name }} {{ user()?.first_name }}</h3>
    <small>{{ user()?.login }}</small>
  </div>

  <nav class="menu">
    @for (category of categories(); track category.id) {
      <button
        type="button"
        class="menu-item"
        [class.active]="selectedCategory() === category.id"
        [class.logout-item]="category.id === 'logout'"
        (click)="onSelect(category.id)"
      >
        <i [class]="category.icon"></i>
        <span>{{ category.label }}</span>
        @if (badges()[category.id]) {
          <small class="menu-badge">{{ badges()[category.id] }}</small>
        }
      </button>
    }
  </nav>
</aside>
