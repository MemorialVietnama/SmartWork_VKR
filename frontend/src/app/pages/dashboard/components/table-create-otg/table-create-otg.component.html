<div class="table-otg">
  <div class="table-otg-head">
    <h4>{{ title() }}</h4>
    <p>{{ description() }}</p>
  </div>

  <div class="otp-preview otp-inputs" aria-label="Код из email">
    @for (slot of previewSlots(); track $index) {
      <input
        #otgInput
        type="text"
        class="otp-slot-input"
        [value]="slot === '•' ? '' : slot"
        inputmode="numeric"
        autocomplete="one-time-code"
        maxlength="6"
        (input)="onSlotInput($index, $any($event.target).value)"
        (keydown)="onSlotKeydown($event, $index)"
        (paste)="onSlotPaste($event, $index)"
      />
    }
  </div>

  <div class="dialog-actions">
    <p-button label="Назад" styleClass="p-button-text" (onClick)="back.emit()" />
    <p-button [label]="confirmLabel()" icon="pi pi-check" [loading]="loading()" (onClick)="confirm.emit()" />
  </div>
</div>
