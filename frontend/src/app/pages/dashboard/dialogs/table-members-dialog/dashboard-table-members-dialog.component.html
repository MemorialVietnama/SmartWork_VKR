<p-dialog
  [visible]="visible()"
  (visibleChange)="visibleChange.emit($event)"
  [modal]="true"
  [dismissableMask]="true"
  [style]="{ width: '34rem', maxWidth: '95vw' }"
  header="Добавление сотрудников в стол"
>
  @if (tableTitle()) {
    <p class="table-title"><strong>Стол:</strong> {{ tableTitle() }}</p>
  }
  @if (employees().length === 0) {
    <p class="muted">Нет сотрудников для добавления.</p>
  } @else {
    <div class="members-grid">
      @for (employee of employees(); track employee.id) {
        <div class="member-card">
          <div>
            <strong>{{ employee.lastName }} {{ employee.firstName }}</strong>
            <small>Готов к добавлению в стол</small>
          </div>
          <p-button label="Добавить" icon="pi pi-user-plus" size="small" (onClick)="addEmployee.emit(employee.id)" />
        </div>
      }
    </div>
  }
  @if (actionError()) {
    <p-message severity="error" [text]="actionError() ?? ''" [closable]="false" />
  }
</p-dialog>
