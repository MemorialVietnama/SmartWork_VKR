<p-dialog
  [visible]="visible()"
  (visibleChange)="visibleChange.emit($event)"
  [modal]="true"
  [style]="{ width: '30rem', maxWidth: '95vw' }"
  header="Приглашение сотрудника"
>
  <p>Отправьте сотруднику код приглашения:</p>
  <div class="invite-link">
    <code>{{ inviteLink() }}</code>
  </div>
  <small>Сотрудник вводит код в разделе «Сотрудники» и принимает приглашение.</small>
</p-dialog>
